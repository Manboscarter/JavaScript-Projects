<h3>Increment Operator</h3>
<p>Increase the number 13 to the next count</p>
<p id="increment"></p>

<button onclick="showIncrement()">Show Increment</button>
 

<script>
    function showIncrement() {
    let increment = 13;
    increment++;
    document.getElementById("increment").innerHTML= increment++;

    }

    Increment();
</script>

<h3>Decrement</h3>
<p>Decrease the number 13 to the next count</p>

<p id="decrement"></p>
<button onclick="showDecrement()">Show Decrement</button>


<script>
    function showDecrement() {
    let decrement = 13;
    decrement --;
    document.getElementById("decrement").innerHTML= decrement--;
    }

    Decrement();
</script>

<h3>Ceiling</h3>
 <p id="cell"></p>

 <button onclick="showCeil()">Show Ceil</button>

<script>
   function showCeil(){
    let x = Math.ceil(8.2);

   }
   Ceil();
</script>

<script>

let g =Math.pow(9,3);

document.getElementById("power").innerHTML= "9 raised to power 3 is: " + g;
